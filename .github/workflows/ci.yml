name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to catch new sv or Better Auth releases that change the generated code.
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      MOCKATOO_TEST_EMAIL: ${{ secrets.MOCKATOO_TEST_EMAIL }}
      MOCKATOO_TEST_PASSWORD: ${{ secrets.MOCKATOO_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Note the skipped sign-in
        if: env.MOCKATOO_TEST_EMAIL == ''
        run: echo "::notice::MOCKATOO_TEST_EMAIL and MOCKATOO_TEST_PASSWORD are not set, so the full sign-in is skipped."
      - run: pnpm test
      - run: pnpm cli:check
