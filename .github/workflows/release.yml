# Publishes @mockatoo/sv to npm when a `v<version>` tag is pushed, with npm trusted
# publishing (OIDC, no npm token). On npmjs.com, the package's trusted publisher must
# be this repository, workflow `release.yml`, environment `npm`.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    env:
      MOCKATOO_TEST_EMAIL: ${{ secrets.MOCKATOO_TEST_EMAIL }}
      MOCKATOO_TEST_PASSWORD: ${{ secrets.MOCKATOO_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Verify the tag matches package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$RELEASE_TAG" || {
            echo "Tag $RELEASE_TAG does not match package.json version $version" >&2
            exit 1
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # A release must prove the full sign-in, not skip it.
      - name: Require test credentials
        run: test -n "$MOCKATOO_TEST_EMAIL" && test -n "$MOCKATOO_TEST_PASSWORD"
      - run: pnpm test
      - run: pnpm cli:check
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
